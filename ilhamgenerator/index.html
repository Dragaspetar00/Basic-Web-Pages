<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>İlham Üretici</title>
<style>
:root{
  --bg:#0f0f11; --fg:#f5f7fb; --muted:#9aa3ad; --card:#16181c; --border:#23262b;
  --accent:#4ade80; --accent-2:#60a5fa; --shadow:0 10px 30px rgba(0,0,0,.35);
  --radius:14px; --btn-radius:12px; --focus:0 0 0 3px rgba(100,255,180,.35);
}
:root[data-theme="light"]{
  --bg:#f5f5f7; --fg:#111317; --muted:#556070; --card:#ffffff; --border:#e6e8ee;
  --accent:#16a34a; --accent-2:#2563eb; --shadow:0 10px 30px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,"Noto Sans";background:var(--bg);color:var(--fg);line-height:1.45}
.app{max-width:980px;margin:24px auto 72px;padding:0 16px}
header{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}
.title{font-size:28px;font-weight:800;letter-spacing:-.02em}
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.controls{display:grid;grid-template-columns:1.1fr auto;gap:12px;align-items:center}
.select{position:relative}
select{width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--border);background:var(--bg);color:var(--fg);font-size:15px;appearance:none;outline:none}
select:focus{box-shadow:var(--focus)}
.button{padding:14px 18px;background:var(--accent);color:white;font-weight:700;border:none;border-radius:var(--btn-radius);cursor:pointer;transition:transform .05s ease,filter .2s ease,box-shadow .2s ease;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.button:hover{filter:brightness(1.05)} .button:active{transform:translateY(1px)}
.result{margin-top:14px;padding:18px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.result-text{font-size:18px;font-weight:600;min-height:24px}
.actions{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}
.action{border:1px solid var(--border);background:transparent;color:var(--fg);border-radius:10px;padding:10px 12px;cursor:pointer}
.action.accent{background:var(--accent-2);border-color:var(--accent-2);color:white}
.favs{margin-top:24px}
.favs-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.favs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.fav{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.fav .meta{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px}
.tag{border:1px dashed var(--border);padding:2px 8px;border-radius:999px;font-size:12px;color:var(--muted)}
footer{margin-top:32px;color:var(--muted);font-size:13px;text-align:center}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card);color:var(--fg);border:1px solid var(--border);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);z-index:9999}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div style="font-size:28px">🎨</div>
      <div class="title">İlham Üretici</div>
    </div>
    <button id="mode" class="action" title="Tema değiştir">🌙/☀️</button>
  </header>

  <div class="panel">
    <div class="controls">
      <label class="select">
        <select id="category" aria-label="Kategori">
          <option value="karakter">🧍 Karakter</option>
          <option value="sahne">🌆 Sahne / Ortam</option>
          <option value="kıyafet">👕 Kıyafet / Stil</option>
          <option value="duygu">🎭 Duygu / Tema</option>
          <option value="aksiyon">⚔️ Aksiyon / Poz</option>
          <option value="kompozisyon">🪞 Kompozisyon</option>
        </select>
      </label>
      <button id="generate" class="button">🎲 Üret</button>
    </div>

    <div class="result" id="resultBox" aria-live="polite">
      <div id="result" class="result-text">Burada fikir görünecek 🎨</div>
      <div class="actions">
        <button id="save" class="action">⭐ Kaydet</button>
        <button id="copy" class="action">📋 Kopyala</button>
        <button id="searchAll" class="action">🌐 Hepsinde Ara</button>
        <button id="searchGoogle" class="action">🔎 Google Görsel</button>
        <button id="searchPinterest" class="action">📌 Pinterest</button>
        <button id="searchArtstation" class="action">🎨 ArtStation</button>
        <button id="expand" class="action accent">✨ Genişlet</button>
      </div>
    </div>
  </div>

  <div class="favs">
    <div class="favs-header">
      <h3>💾 Favoriler</h3>
      <div>
        <button id="clearFavs" class="action">🗑️ Temizle</button>
      </div>
    </div>
    <div id="favsGrid" class="favs-grid"></div>
  </div>

  <footer>Dragaspetar Manga</footer>
</div>

let lastPick = null;

function rand(arr){ return arr[Math.floor(Math.random()*arr.length)] }
function pickIdea(category){
  const list = defaultData[category] || [];
  if (!list.length) return "Bu kategoride henüz fikir yok.";
  let idea = rand(list);
  if (lastPick && lastPick.category===category && list.length>1){
    for (let i=0;i<5 && idea===lastPick.text;i++) idea = rand(list);
  }
  lastPick = { category, text: idea };
  return idea;
}
function setResult(text){ document.getElementById('result').textContent = text; }
function getCurrentCategory(){ return document.getElementById('category').value; }
function currentIdea(){ return document.getElementById('result').textContent.trim(); }
function pulse(node){ node.animate([{transform:'scale(1)'},{transform:'scale(1.01)'},{transform:'scale(1)'}], {duration:200,easing:'ease-out'}); }

// Favoriler
function loadFavs(){ try{ const raw=localStorage.getItem(STORAGE_KEYS.favs); return raw?JSON.parse(raw):[]; }catch{return []} }
function saveFavs(f){ localStorage.setItem(STORAGE_KEYS.favs, JSON.stringify(f)); }
function addFav(idea,category){
  const favs=loadFavs();
  if (favs.some(f=>f.text===idea && f.category===category)) return;
  favs.unshift({ id: crypto.randomUUID(), text: idea, category, ts: Date.now() });
  saveFavs(favs); renderFavs();
}
function removeFav(id){ const favs=loadFavs().filter(f=>f.id!==id); saveFavs(favs); renderFavs(); }
function timeAgo(ts){ const s=Math.floor((Date.now()-ts)/1000); if(s<60) return s+'sn'; const m=Math.floor(s/60); if(m<60) return m+'dk'; const h=Math.floor(m/60); if(h<24) return h+'s'; const d=Math.floor(h/24); return d+'g'; }
function emojiFor(cat){ return ({ karakter:'🧍', sahne:'🌆', kıyafet:'👕', duygu:'🎭', aksiyon:'⚔️', kompozisyon:'🪞' }[cat] || '🎨'); }
function escapeHtml(s){ return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])); }
function renderFavs(){
  const grid=document.getElementById('favsGrid'); const favs=loadFavs(); grid.innerHTML='';
  if(!favs.length){ grid.innerHTML='<small style="color:var(--muted)">Henüz favori yok.</small>'; return; }
  for(const f of favs){
    const el=document.createElement('div'); el.className='fav';
    el.innerHTML=`
      <div class="meta">
        <span class="tag">${emojiFor(f.category)} ${f.category}</span>
        <span>${timeAgo(f.ts)}</span>
      </div>
      <div style="font-weight:600">${escapeHtml(f.text)}</div>
      <div class="actions">
        <button class="action" data-act="use">🎲 Kullan</button>
        <button class="action" data-act="copy">📋</button>
        <button class="action" data-act="search">🔎</button>
        <button class="action" data-act="del">🗑️</button>
      </div>
    `;
    el.querySelector('[data-act="use"]').onclick=()=>{ document.getElementById('category').value=f.category; setResult(f.text); pulse(document.getElementById('resultBox')); };
    el.querySelector('[data-act="copy"]').onclick=()=>navigator.clipboard.writeText(f.text);
    el.querySelector('[data-act="search"]').onclick=()=>openAllSearch(f.text);
    el.querySelector('[data-act="del"]').onclick=()=>removeFav(f.id);
    grid.appendChild(el);
  }
}

// Arama
function openGoogle(q){ window.open(`https://www.google.com/search?tbm=isch&q=${encodeURIComponent(q)}`,'_blank'); }
function openPinterest(q){ window.open(`https://www.pinterest.com/search/pins/?q=${encodeURIComponent(q)}`,'_blank'); }
function openArtstation(q){ window.open(`https://www.artstation.com/search?sort_by=relevance&query=${encodeURIComponent(q)}`,'_blank'); }
function openAllSearch(q){ openGoogle(q); openPinterest(q); openArtstation(q); }

// Genişlet (yerel)
async function onExpand(){
  const idea = currentIdea();
  if (!idea || idea.includes('Burada fikir')) return;
  const category = getCurrentCategory();
  const text = await expandIdeaLocal(idea, category);
  showModal(text);
}
async function expandIdeaLocal(idea, category){
  const seeds = {
    sahne:["ışık","hava","arka plan","doku","perspektif"],
    karakter:["yaş","göz","aksesuar","köken","motivasyon"],
    kıyafet:["malzeme","katman","renk","silüet","dikiş"],
    duygu:["tempo","kontrast","metafor","ritim","gerilim"],
    aksiyon:["kamera açısı","hareket izi","odak","bulanıklık","denge"],
    kompozisyon:["odak","denge","hatlar","negatif alan","kontrast"]
  };
  const hints = seeds[category] || ["odak","ışık","renk","doku"];
  const extra = hints[Math.random()*hints.length|0], extra2 = hints[Math.random()*hints.length|0];
  return [
    idea, "—",
    `Detay: ${category} için ${extra} ve ${extra2} vurgusuyla çalış.`,
    "Işık: Yumuşak kenarlı tek ana ışık; arka plan düşük doygun.",
    "Renk: 2 ana ton + 1 vurgu; derinlikle doygunluğu azalt.",
    "Not: Referans için 3 görsel seç, birini ışık referansı yap."
  ].join("\n");
}
function showModal(text){
  const wrap=document.createElement('div');
  Object.assign(wrap.style,{position:'fixed',inset:'0',background:'rgba(0,0,0,.5)',display:'grid',placeItems:'center',zIndex:9998});
  const box=document.createElement('div');
  Object.assign(box.style,{maxWidth:'720px',width:'min(92vw,720px)',background:'var(--card)',color:'var(--fg)',border:'1px solid var(--border)',borderRadius:'14px',boxShadow:'var(--shadow)',padding:'16px'});
  box.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;">
      <b>✨ Genişletilmiş Fikir</b>
      <div>
        <button id="mCopy" class="action">📋 Kopyala</button>
        <button id="mClose" class="action">✖️ Kapat</button>
      </div>
    </div>
    <pre style="white-space:pre-wrap;font-family:inherit">${escapeHtml(text)}</pre>
  `;
  wrap.appendChild(box); document.body.appendChild(wrap);
  box.querySelector('#mClose').onclick=()=>wrap.remove();
  box.querySelector('#mCopy').onclick=()=>navigator.clipboard.writeText(text);
  wrap.addEventListener('click',(e)=>{ if(e.target===wrap) wrap.remove(); });
}

// Tema
function initTheme(){
  const saved = localStorage.getItem(STORAGE_KEYS.theme);
  if (saved==='light' || saved==='dark') document.documentElement.setAttribute('data-theme', saved);
  document.getElementById('mode').onclick=()=>{
    const cur=document.documentElement.getAttribute('data-theme');
    const next=cur==='light'?'dark':'light';
    document.documentElement.setAttribute('data-theme',next);
    localStorage.setItem(STORAGE_KEYS.theme,next);
  };
}

// Toast
function toast(msg){
  const div=document.createElement('div'); div.className='toast'; div.textContent=msg;
  document.body.appendChild(div); setTimeout(()=>div.remove(),1400);
}

// Etkileşimler
function onGenerate(){
  const cat = getCurrentCategory();
  const idea = pickIdea(cat);
  setResult(idea); pulse(document.getElementById('resultBox'));
}
function init(){
  initTheme();
  renderFavs();
  document.getElementById('generate').onclick = onGenerate;
  document.getElementById('expand').onclick = onExpand;
  document.getElementById('save').onclick = ()=>{ const txt=currentIdea(); if(!txt || txt.includes('Burada fikir')) return; addFav(txt, getCurrentCategory()); toast('Kaydedildi ⭐'); };
  document.getElementById('copy').onclick = ()=>{ const txt=currentIdea(); if(!txt || txt.includes('Burada fikir')) return; navigator.clipboard.writeText(txt).then(()=>toast('Kopyalandı!')); };
  document.getElementById('searchAll').onclick = ()=>{ const txt=currentIdea(); if(!txt || txt.includes('Burada fikir')) return; openAllSearch(txt); };
  document.getElementById('searchGoogle').onclick = ()=>{ const txt=currentIdea(); if(!txt || txt.includes('Burada fikir')) return; openGoogle(txt); };
  document.getElementById('searchPinterest').onclick = ()=>{ const txt=currentIdea(); if(!txt || txt.includes('Burada fikir')) return; openPinterest(txt); };
  document.getElementById('searchArtstation').onclick = ()=>{ const txt=currentIdea(); if(!txt || txt.includes('Burada fikir')) return; openArtstation(txt); };
  document.getElementById('clearFavs').onclick = ()=>{ if (confirm('Favorileri temizle?')){ localStorage.removeItem(STORAGE_KEYS.favs); renderFavs(); } };
}
function escapeHtml(s){ return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])); }
init();
</script>
